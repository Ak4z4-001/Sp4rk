<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Para Estrellita 🌹</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="flores.css?v=1">
</head>
<body>

<main class="world" id="world">

  <!-- ============ ANIMATED PIXEL BACKGROUND ============ -->
  <div class="sky"></div>
  <div class="stars" id="stars"></div>

  <div class="moon">
    <div class="moon-glow"></div>
    <div class="moon-body"></div>
  </div>

  <!-- three drifting cloud layers, back to front -->
  <div class="cloud-layer layer-far"  id="cloudFar"></div>
  <div class="cloud-layer layer-mid"  id="cloudMid"></div>
  <div class="cloud-layer layer-near" id="cloudNear"></div>

  <div class="birds" id="birds"></div>

  <div class="hills">
    <div class="hill hill-back"></div>
    <div class="hill hill-front"></div>
  </div>

  <div class="field" id="field"></div>

  <!-- ============ CHARACTERS ============ -->
  <div class="scene">

    <div class="char-slot boy-slot">
      <img class="char boy" id="boy"
           src="img/chico-rodilla.png"
           alt="Sp4rk ofreciendo unas rosas"
           data-kneeling="img/chico-rodilla.png"
           data-standing="img/chico-parado.png">
    </div>

    <div class="char-slot girl-slot">
      <!-- heart-shaped bubble, sits above her head -->
      <div class="bubble" id="bubble">
        <svg class="bubble-heart" viewBox="0 0 200 182" aria-hidden="true">
          <path d="M100 168 C38 122 10 88 10 57 C10 29 33 10 58 10
                   C77 10 93 21 100 37 C107 21 123 10 142 10
                   C167 10 190 29 190 57 C190 88 162 122 100 168 Z"/>
        </svg>

        <div class="bubble-content">
          <p class="bubble-text" id="bubbleText">¿Aceptas<br>las flores?</p>
          <div class="bubble-btns" id="bubbleBtns">
            <button class="pix-btn accept" id="acceptBtn" type="button">Aceptar 🌹</button>
            <button class="pix-btn reject" id="rejectBtn" type="button">Rechazar</button>
          </div>
        </div>

        <span class="bubble-tail"></span>
      </div>

      <img class="char girl" id="girl"
           src="img/chica-parada.png"
           alt="Estrellita"
           data-empty="img/chica-parada.png"
           data-flowers="img/chica-flores.png">
    </div>

  </div>

  <!-- celebration petals / hearts land here -->
  <div class="confetti" id="confetti"></div>

  <p class="ending" id="ending"></p>

</main>

<script src="flores.js?v=2"></script>
</body>
</html>
